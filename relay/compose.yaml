services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    image: todo-relay
    restart: unless-stopped
    env_file: relay/.env
    environment:
      TODO_RELAY_BIND: 0.0.0.0:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - relay-data:/var/lib/todo-relay

volumes:
  relay-data:
