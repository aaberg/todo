[package]
name = "todo-desktop"
version.workspace = true
edition = "2024"
description = "Desktop app for todo (Tauri)"
default-run = "todo-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
todo-common = { path = "../../common" }
todo-core = { path = "../../core" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[lib]
name = "todo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "todo-desktop"
path = "src/main.rs"
